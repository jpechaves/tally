# English. Keys mirror config/i18n/pt-BR.yml exactly (spec/unit/i18n_spec.rb checks).
# Pages use absolute keys named after their template: "report.show.title" is in
# app/templates/report/show.html.erb.
en:
  date:
    formats:
      day: "%b %-d, %Y"
      month: "%b %Y"

  common:
    add: Add
    dismiss: Dismiss
    net: Net
    none: None.
    nothing_imported_html: Nothing imported yet. Start by <a href="/imports">importing your statements</a>.
    range: "%{from} to %{to}"
    remove: Remove
    rows: Rows
    row_count:
      one: 1 row
      other: "%{count} rows"
    save: Save
    show: Show

  layout:
    groups:
      data: Data
      organize: Organize
      overview: Overview
      planning: Planning
    nav:
