name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    env:
      HANAMI_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install the sqlite3 command (used by hanami db)
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: Prepare the test database
        run: bin/hanami db prepare
      - name: Run the tests
        run: bundle exec rspec
