name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    env:
      HANAMI_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install sqlite3 (used by hanami db) and poppler-utils (pdftotext, for Itaú bills)
        run: |
          if ! command -v sqlite3 || ! command -v pdftotext; then
            sudo apt-get update && sudo apt-get install -y sqlite3 poppler-utils
          fi
      - name: Prepare the test database
        run: bin/hanami db prepare
      - name: Run the tests
        run: bundle exec rspec
